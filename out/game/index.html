<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Starlight Courier — 星光快递</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; padding: 0; background: #04050f; min-height: 100vh; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas {
    display: block;
    width: min(100vw, calc(100vh * 16 / 9));
    height: auto;
    cursor: crosshair;
    touch-action: none;
  }
  #selftest {
    position: fixed; left: 0; top: 0; z-index: 10;
    margin: 0; padding: 12px; max-width: 90vw;
    background: rgba(0,0,0,0.85); color: #9be48a;
    font: 13px monospace; white-space: pre-wrap;
  }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720"></canvas>
<pre id="selftest" style="display:none"></pre>
<script type="module" src="./src/main.js"></script>
</body>
</html>
